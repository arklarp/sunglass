<!doctype html>

<title>SUNGLASS — draw sunlight into glass before the storm</title>

</style>

<canvas id="game" aria-label="SUNGLASS: sail with WASD, aim the crystal lens with the mouse, hold the button to sinter glass paths across the dunes and light every beacon before the storm wall reaches you."></canvas>

<script type="module" src="./src/main.js"></script>
